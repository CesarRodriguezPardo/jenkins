volumes: 
  jenkins-volume: {}
  # se define el volumen vacío, en este caso no es necesario definirlo como externo.

services:
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
    volumes:
      - jenkins-volume:/var/jenkins_home      
        # se utiliza el volumen nombrado para mantener un mejor control sobre los datos, estos se mapean a var/jenkins_home que es el directorio que utiliza jenkins para guardar sus datos.
